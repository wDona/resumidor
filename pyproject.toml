[project]
name = "actas"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.147.0",
    "faster-whisper>=1.2.1",
    "keyring>=25.7.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "python-docx>=1.2.0",
    "rapidocr-onnxruntime>=1.4.4",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core==1.13.8",
    "soundcard>=0.4.6",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.10.21",
]

[tool.uv]
# onnxruntime dejó de publicar ruedas para macOS Intel tras la 1.23.2
override-dependencies = ["onnxruntime>=1.20 ; sys_platform != 'darwin' or platform_machine != 'x86_64'", "onnxruntime==1.23.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'"]
