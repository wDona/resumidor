name: instalador

on:
  push: {branches: [master], tags: ['v*']}
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # adjuntar el instalador a la release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, target: win-x64}
          # Pendiente (mismos pasos con tools/fetch_bins.py --target <target>, empaquetado propio):
          # - {os: ubuntu-latest, target: linux-x64}
          # - {os: macos-14, target: macos-arm64}   # Apple Silicon
          # - {os: macos-13, target: macos-x64}     # Intel
    runs-on: ${{ matrix.os }}
    env:
      APPDIR: C:\Pérez y Cía\Actas   # ruta con espacios y tilde a propósito
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: ffmpeg + llama.cpp + uv
        run: python tools/fetch_bins.py --target ${{ matrix.target }} --uv

      - name: Compilar instalador
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}" installer\actas.iss
          Get-Item installer\Output\Actas-setup.exe | Select Name, Length

      # los modelos se bajan dentro de la app instalada: se cachean en su carpeta
      - uses: actions/cache@v4
        with:
          path: C:\Pérez y Cía\Actas\models
          key: modelos-${{ hashFiles('models.py') }}

      - name: Instalación silenciosa
        run: |
          $p = Start-Process installer\Output\Actas-setup.exe -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$env:APPDIR`"","/LOG=`"$PWD\install.log`""
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 30; Get-Content "$env:APPDIR\instalacion.log" -Tail 30 -ErrorAction SilentlyContinue; exit $p.ExitCode }
          Get-ChildItem $env:APPDIR | Select Name; Get-Content "$env:APPDIR\instalacion.log" -Tail 20 -ErrorAction SilentlyContinue; Select-String -Path install.log -Pattern 'uv|instalar|Exec|Running|Abort' | Select -Last 15 | % Line
          Get-ChildItem "$env:APPDIR\.venv\Scripts\pythonw.exe", "$env:APPDIR\bin" -Recurse -Include pythonw.exe,llama-server.exe,ffmpeg.exe | Select FullName

      - name: Vídeo de prueba (voz SAPI + imagen)
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$PWD\voz.wav")
          $t = 'Buenos días a todos. Hoy revisamos el presupuesto del proyecto. El plan cuesta veinticinco euros al mes. Decidimos lanzar la versión nueva el martes. Laura se encarga de enviar el informe final. Gracias y hasta la próxima reunión.'
          1..3 | % { $s.Speak($t) }
          $s.Dispose()
          & "$env:APPDIR\bin\ffmpeg\ffmpeg.exe" -v error -y -f lavfi -i testsrc2=s=1280x720:r=5 -i voz.wav -shortest -c:v libx264 -pix_fmt yuv420p muestra.mp4
          Get-Item muestra.mp4 | Select Length

      - name: rag selftest
        run: '& "$env:APPDIR\.venv\Scripts\python.exe" -X utf8 "$env:APPDIR\rag.py" --selftest'

      - name: Humo (ping, modelos, acta, preguntar)
        run: '& "$env:APPDIR\.venv\Scripts\python.exe" -X utf8 tools\smoke.py "$env:APPDIR" "$PWD\muestra.mp4"'

      - name: Desinstalar (conservando datos)
        run: |
          $u = Get-ChildItem $env:APPDIR -Filter 'unins*.exe' | Select -First 1
          Start-Process $u.FullName -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES'
          if (Test-Path "$env:APPDIR\.venv") { throw 'queda .venv' }
          if (-not (Test-Path "$env:APPDIR\models")) { throw 'se borraron los modelos' }

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.target }}
          path: installer/Output/Actas-setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.target }}
          path: |
            install.log
            C:\Pérez y Cía\Actas\instalacion.log
            C:\Pérez y Cía\Actas\work\app.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: instalador-win-x64}
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes Actas-setup.exe
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
