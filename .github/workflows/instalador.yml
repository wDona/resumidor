name: instalador

on:
  push: {branches: [master], tags: ['v*']}
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # adjuntar el instalador a la release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, target: win-x64}
          # Pendiente: - {os: ubuntu-latest, target: linux-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      APPDIR: C:\Pérez y Cía\Actas   # ruta con espacios y tilde a propósito
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: ffmpeg + llama.cpp + uv
        run: python tools/fetch_bins.py --target ${{ matrix.target }} --uv  # incluye CPython empaquetado

      - name: Compilar instalador
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}" installer\actas.iss
          Get-Item installer\Output\Actas-setup.exe | Select Name, Length

      # los modelos se bajan dentro de la app instalada: se cachean en su carpeta
      - uses: actions/cache@v4
        with:
          path: C:\Pérez y Cía\Actas\models
          key: modelos-${{ hashFiles('models.py') }}

      - name: Instalación silenciosa
        timeout-minutes: 15
        run: |
          $p = Start-Process installer\Output\Actas-setup.exe -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$env:APPDIR`"","/LOG=`"$PWD\install.log`""
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 30; Get-Content "$env:APPDIR\instalacion.log" -Tail 30 -ErrorAction SilentlyContinue; exit $p.ExitCode }
          Get-ChildItem $env:APPDIR | % Name; Get-Content "$env:APPDIR\instalacion.log" -Tail 20 -ErrorAction SilentlyContinue; Get-Content install.log -Tail 25
          Get-ChildItem "$env:APPDIR\.venv\Scripts\pythonw.exe", "$env:APPDIR\bin" -Recurse -Include pythonw.exe,llama-server.exe,ffmpeg.exe | Select FullName

      - name: Sin uniones ni enlaces (RedirectionGuard, error 448)
        run: |
          $r = Get-ChildItem $env:APPDIR -Recurse -Force -Attributes ReparsePoint -ErrorAction SilentlyContinue
          if ($r) { $r | % FullName; throw 'hay puntos de reanálisis en la instalación' }

      - name: Vídeo de prueba (voz SAPI + imagen)
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$PWD\voz.wav")
          $t = 'Buenos días a todos. Hoy revisamos el presupuesto del proyecto. El plan cuesta veinticinco euros al mes. Decidimos lanzar la versión nueva el martes. Laura se encarga de enviar el informe final. Gracias y hasta la próxima reunión.'
          1..3 | % { $s.Speak($t) }
          $s.Dispose()
          & "$env:APPDIR\bin\ffmpeg\ffmpeg.exe" -v error -y -f lavfi -i testsrc2=s=1280x720:r=5 -i voz.wav -shortest -c:v libx264 -pix_fmt yuv420p muestra.mp4
          Get-Item muestra.mp4 | Select Length

      - name: rag selftest
        run: '& "$env:APPDIR\.venv\Scripts\python.exe" -X utf8 "$env:APPDIR\rag.py" --selftest'

      - name: Humo (ping, modelos, acta, preguntar)
        timeout-minutes: 45
        run: '& "$env:APPDIR\.venv\Scripts\python.exe" -X utf8 tools\smoke.py "$env:APPDIR" "$PWD\muestra.mp4"'

      - name: Desinstalar (conservando datos)
        timeout-minutes: 5
        run: |
          Get-Process llama-server -ErrorAction SilentlyContinue | Stop-Process -Force
          $u = Get-ChildItem $env:APPDIR -Filter 'unins*.exe' | Select -First 1
          $p = Start-Process $u.FullName -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'el desinstalador no termina' }
          Start-Sleep 5  # el desinstalador real es una copia temporal que sigue un momento
          if (Test-Path "$env:APPDIR\.venv") { throw 'queda .venv' }
          if (-not (Test-Path "$env:APPDIR\models")) { throw 'se borraron los modelos' }

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.target }}
          path: installer/Output/Actas-setup.exe
      - name: Reunir logs
        if: always()
        run: |
          New-Item logs -ItemType Directory -Force | Out-Null
          Copy-Item "$env:APPDIR\instalacion.log","$env:APPDIR\work\app.log" logs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.target }}
          path: |
            install.log
            logs

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, target: macos-arm64, arch: arm64}        # Apple Silicon
          - {os: macos-15-intel, target: macos-x64, arch: x64}      # Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SUP: ~/Library/Application Support/Actas
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg + llama.cpp + uv + CPython
        timeout-minutes: 10
        run: python3 tools/fetch_bins.py --target ${{ matrix.target }} --uv

      - name: Compilar .dmg
        timeout-minutes: 10
        run: installer/macos/build.sh ${{ matrix.arch }} "${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: installer/Output/Actas-${{ matrix.arch }}.dmg

      - uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Actas/app/models
          key: modelos-mac-${{ hashFiles('models.py') }}

      - name: Montar .dmg, copiar la app y primer arranque (sin navegador)
        timeout-minutes: 15
        run: |
          hdiutil attach installer/Output/Actas-${{ matrix.arch }}.dmg -mountpoint /Volumes/Actas -nobrowse
          mkdir -p "$HOME/Applications" && cp -R /Volumes/Actas/Actas.app "$HOME/Applications/"
          hdiutil detach /Volumes/Actas
          ACTAS_NO_BROWSER=1 ACTAS_SETUP_ONLY=1 "$HOME/Applications/Actas.app/Contents/MacOS/Actas"
          tail -5 "$HOME/Library/Application Support/Actas/instalacion.log"
          ls "$HOME/Library/Application Support/Actas/app/.venv/bin/python" "$HOME/Library/Application Support/Actas/app/bin"

      - name: Vídeo de prueba (voz de macOS + imagen)
        run: |
          T='Buenos días a todos. Hoy revisamos el presupuesto del proyecto. El plan cuesta veinticinco euros al mes. Decidimos lanzar la versión nueva el martes. Laura se encarga de enviar el informe final. Gracias y hasta la próxima reunión.'
          say -v '?' | grep -i es_ | head -5 || true
          say -v Eddy -o voz.aiff "$T $T $T" || say -v Monica -o voz.aiff "$T $T $T" || say -v Paulina -o voz.aiff "$T $T $T" || say -o voz.aiff "$T $T $T"
          FF="$HOME/Library/Application Support/Actas/app/bin/ffmpeg"
          "$FF/ffmpeg" -v error -y -f lavfi -i testsrc2=s=1280x720:r=5 -i voz.aiff -shortest -c:v libx264 -pix_fmt yuv420p muestra.mp4
          "$FF/ffmpeg" -v error -encoders | grep -i videotoolbox || true
          ls -l muestra.mp4

      - name: rag selftest
        run: cd "$HOME/Library/Application Support/Actas/app" && .venv/bin/python -X utf8 rag.py --selftest

      - name: Humo (ping, modelos, acta, preguntar) con Metal / por defecto
        timeout-minutes: 40
        run: |
          D="$HOME/Library/Application Support/Actas/app"
          "$D/.venv/bin/python" -X utf8 tools/smoke.py "$D" "$PWD/muestra.mp4"

      - name: Humo solo CPU (ACTAS_CPU=1, para comparar tiempos)
        if: matrix.arch == 'arm64'
        timeout-minutes: 20
        run: |
          D="$HOME/Library/Application Support/Actas/app"
          rm -rf "$D/work"
          ACTAS_CPU=1 "$D/.venv/bin/python" -X utf8 tools/smoke.py "$D" "$PWD/muestra.mp4"

      - name: Reunir logs
        if: always()
        run: |
          mkdir -p logs
          cp "$HOME/Library/Application Support/Actas/"*.log logs/ || true
          cp "$HOME/Library/Application Support/Actas/app/work/"*.log logs/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.target }}
          path: logs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: '{instalador,dmg}-*', merge-multiple: true}
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes Actas-setup.exe Actas-arm64.dmg Actas-x64.dmg
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
